pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'codpattern-zombies'

// The addon is the runnable build.  It consumes the main mod as a sibling
// project, which keeps the main repository independent of addon sources.
include(':codpattern-main')
project(':codpattern-main').projectDir = file('../codPattern')

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'codpattern-zombies'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def mainProject = project(':codpattern-main')
def barrierGroupRulesGameTests = project.hasProperty('barrierGroupRulesGameTests')
def backpackGameTests = project.hasProperty('backpackGameTests')
def navigationLoadSize = findProperty('navigationLoad')?.toString()
if (navigationLoadSize && !(navigationLoadSize in ['8', '32', '64'])) {
    throw new GradleException('navigationLoad must be 8, 32, or 64')
}
def gameTestRunDirectory = file(findProperty('gameTestRunDirectory') ?: layout.buildDirectory.dir('gametest/run').get().asFile)
def dedicatedServerRunRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('server') || it.toLowerCase().contains('gametest')
}
def mainRuntimeOutput = files(
        mainProject.layout.buildDirectory.dir('classes/java/main'),
        mainProject.layout.buildDirectory.dir('resources/main'))
def mainTestOutput = files(
        mainProject.layout.buildDirectory.dir('classes/java/test'),
        mainProject.layout.buildDirectory.dir('resources/test'))

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            // ForgeGradle's normal runClient task is rooted in this addon
            // checkout, never in the main mod's directory.
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                codpattern {
                    source mainProject.sourceSets.main
                }
                codpattern_zombies {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'codpattern_zombies'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'codpattern_zombies'
            args '--nogui'
        }

        gameTestServer {
            // Forge's launch module graph must include the JDK random service providers.
            jvmArgs '--add-modules=jdk.random'
            workingDirectory gameTestRunDirectory
            property 'codpattern.test.workspace', project.projectDir.absolutePath
            property 'codpattern.test.results', (findProperty('barrierGroupRulesResultsPath') ?: 'build/verification/barrier-group-rules/forge-results.txt').toString()
            property 'forge.enabledGameTestNamespaces', backpackGameTests ? 'codpattern_backpack' : barrierGroupRulesGameTests ? 'codpattern_barrier_rules' : navigationLoadSize ? "codpattern_navigation_load${navigationLoadSize}"
                    : (project.hasProperty('navigationGameTests') ? 'codpattern_navigation'
                    : (findProperty('forceEndGameTests') ? 'codpattern_termination' : 'codpattern'))
            property 'codpattern.zombies.navigationDebug', project.hasProperty('navigationDebug') ? 'true' : 'false'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            environment 'MOD_CLASSES', [
                    "codpattern%%${mainProject.layout.buildDirectory.dir('resources/main').get().asFile.absolutePath}",
                    "codpattern%%${mainProject.layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}",
                    "codpattern_zombies%%${layout.buildDirectory.dir('resources/main').get().asFile.absolutePath}",
                    "codpattern_zombies%%${layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath}",
                    "codpattern_zombies%%${layout.buildDirectory.dir('gametest/deploy-tests').get().asFile.absolutePath}"
            ].join(File.pathSeparator)
        }

        data {
            args '--mod', 'codpattern_zombies', '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

tasks.register('syncGameTestStructures', Copy) {
    group = 'verification'
    description = 'Copy the shared empty GameTest template into the isolated addon test directory.'
    from mainProject.layout.projectDirectory.dir('src/main/resources/gameteststructures')
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    into new File(gameTestRunDirectory, 'gameteststructures')
    include '**/*.snbt'
}

tasks.register('compileBarrierGroupRulesGameTests', JavaCompile) {
    group = 'verification'
    description = 'Compile only the barrier-group rule checks and their Forge GameTest entrypoints.'
    source project.files(
            'src/test/java/com/cdp/codpattern/config/zombies/ZombiesBarrierGroupsConfigCompatTest.java',
            'src/test/java/com/cdp/codpattern/app/zombies/service/ZombiesBarrierGroupRulesPurchaseCompatTest.java',
            'src/test/java/com/cdp/codpattern/app/zombies/service/ZombiesSpawnAssignmentServiceCompatTest.java',
            'src/test/java/com/cdp/codpattern/app/zombies/validation/ZombiesMapValidatorMvp2Mvp3CompatTest.java',
            'src/test/java/com/cdp/codpattern/app/zombies/deploy/ZombiesBarrierGroupRulesEditorCompatTest.java',
            'src/test/java/com/cdp/codpattern/app/zombies/deploy/ZombiesDeployObjectEditorCompatTest.java',
            'src/test/java/com/cdp/codpattern/app/zombies/deploy/ZombiesPlayerSpawnRuntimeGameTestSupport.java',
            'src/test/java/com/cdp/codpattern/app/zombies/deploy/ZombiesBarrierGroupRulesGameTests.java')
    classpath = sourceSets.test.compileClasspath + sourceSets.main.output
    destinationDirectory.set(layout.buildDirectory.dir('verification/barrier-group-rules/forge-test-classes'))
    javaCompiler.set(project.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) })
    options.encoding = 'UTF-8'
    dependsOn tasks.named('classes')
}

tasks.register('syncZombiesDeployGameTestClasses', Sync) {
    group = 'verification'
    description = 'Stage addon-owned deploy tests without the test packages shared with the main mod.'
    if (backpackGameTests) {
        dependsOn tasks.named('testClasses')
        from(sourceSets.test.output.classesDirs) {
            include 'com/cdp/codpattern/app/zombies/deploy/ZombiesBackpackGameTests*'
            include 'com/cdp/codpattern/app/zombies/deploy/ZombiesDeployGameTestBootstrap*'
            include 'com/cdp/codpattern/app/zombies/service/ZombiesBackpackRuntimeTestSupport*'
            include 'com/cdp/codpattern/config/zombies/ZombiesBackpackCompatSuite*'
        }
        from('src/test/resources') { include 'data/codpattern_backpack/**' }
    } else if (barrierGroupRulesGameTests) {
        dependsOn tasks.named('compileBarrierGroupRulesGameTests')
        from layout.buildDirectory.dir('verification/barrier-group-rules/forge-test-classes')
        from('src/test/resources') { include 'data/codpattern_barrier_rules/**' }
    } else {
        dependsOn tasks.named('testClasses')
        from sourceSets.test.output.classesDirs
        include 'com/cdp/codpattern/app/zombies/deploy/**'
    }
    into layout.buildDirectory.dir('gametest/deploy-tests')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
    dependsOn tasks.named('syncZombiesDeployGameTestClasses')
}

repositories {
    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    flatDir { dirs mainProject.file('libs') }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('curse.maven:timeless-and-classics-zero-1028108:6654541-sources-6654543')
    compileOnly fg.deobf('maven.modrinth:lr-tactical:0.3.0')
    // Keep the addon-side client run equivalent to the main mod's normal
    // client environment.  These are external runtime mods, not addon
    // project sources fetched by the main build.
    if (!dedicatedServerRunRequested) {
        runtimeOnly fg.deobf('maven.modrinth:physicsmod:JkM3OTEl')
        runtimeOnly fg.deobf('maven.modrinth:taczaddon:1.1.6')
    }

    // The main project is a sibling source project.  Its classes are exposed
    // for compilation and loaded separately by the run config's codpattern
    // mod entry; they are not packaged into the addon JAR.
    // Use the compiled output paths directly here.  Keeping this as a plain
    // file collection avoids Gradle wiring the addon `classes` task back into
    // the main project's source-set lifecycle (which would form a cycle).
    compileOnly mainRuntimeOutput
}

tasks.named('compileJava').configure {
    dependsOn mainProject.tasks.named('classes')
}

sourceSets.test.compileClasspath += mainRuntimeOutput
sourceSets.test.compileClasspath += mainTestOutput
sourceSets.test.runtimeClasspath += mainRuntimeOutput
sourceSets.test.runtimeClasspath += mainTestOutput

tasks.named('compileTestJava').configure {
    dependsOn mainProject.tasks.named('testClasses')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_version: mod_version,
            codpattern_version_range: codpattern_version_range,
            mod_license: mod_license,
            mod_authors: mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'       : 'codpattern_zombies',
                'Specification-Vendor'      : mod_authors,
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : project.jar.archiveVersion,
                'Implementation-Vendor'     : mod_authors,
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// Use the shared snapshot task with this addon's archive name and version.
apply from: mainProject.file('gradle/snapshot.gradle')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def splitCompatTestClasspath = files(
        sourceSets.test.output,
        sourceSets.main.output,
        mainTestOutput,
        mainRuntimeOutput) + sourceSets.test.compileClasspath

['ZombiesNavigationProgressTrackerCompatTest', 'ZombiesMobRecycleProgressCompatTest',
 'ZombiesGroundSpawnPolicyCompatTest', 'ZombiesWaveRuntimeStaticContractCompatTest'].each { testName ->
    tasks.register("run${testName}", JavaExec) {
        group = 'verification'
        workingDir = mainProject.projectDir
        classpath = splitCompatTestClasspath
        mainClass = "com.cdp.codpattern.app.zombies.service.${testName}"
        dependsOn tasks.named('testClasses')
    }
}

tasks.register('runZombiesNavigationCompatSuite') {
    group = 'verification'
    dependsOn 'runZombiesNavigationProgressTrackerCompatTest', 'runZombiesMobRecycleProgressCompatTest',
            'runZombiesGroundSpawnPolicyCompatTest', 'runZombiesWaveRuntimeStaticContractCompatTest'
}

tasks.register('runZombiesForceEndCompatSuite', JavaExec) {
    group = 'verification'
    description = 'Run focused addon regressions for shared room termination.'
    workingDir = mainProject.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.app.zombies.service.ZombiesForceEndCompatTestSuite'
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}

tasks.register('runZombiesMvp123CompatSuite', JavaExec) {
    group = 'verification'
    description = 'Run the addon-owned pure JVM zombies MVP1-MVP3 compatibility suite.'
    // Historical static contracts address main sources as src/... and addon
    // sources as ../zombies-addon/...; keep that layout identical whether the
    // task is launched from the main or addon checkout.
    workingDir = mainProject.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.app.zombies.service.ZombiesMvp123CompatTestSuite'
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}

tasks.register('runZombiesDeployCompatSuite', JavaExec) {
    group = 'verification'
    description = 'Run deployment source, localization, and close-response checks; runtime coverage uses runGameTestServer.'
    workingDir = mainProject.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.app.zombies.service.ZombiesDeployCompatTestSuite'
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}

tasks.register('runZombiesWeaponHudCompat', JavaExec) {
    group = 'verification'
    description = 'Check weapon HUD geometry, formatting, and overlay integration.'
    workingDir = mainProject.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.client.gui.overlay.zombies.ZombiesWeaponHudCompatSuite'
    dependsOn tasks.named('testClasses')
}

tasks.register('runZombiesSodaHudCompat', JavaExec) {
    group = 'verification'
    description = 'Check soda HUD ownership, lifecycle visibility, and collision-free layout.'
    workingDir = mainProject.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.client.gui.overlay.zombies.ZombiesSodaHudCompatSuite'
    dependsOn tasks.named('testClasses')
}

tasks.register('runZombiesObjectLabelCompat', JavaExec) {
    group = 'verification'
    description = 'Check world-label packing, projection, and renderer integration.'
    workingDir = mainProject.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.client.zombies.ZombiesObjectLabelCompatSuite'
    dependsOn tasks.named('testClasses')
}

tasks.register('runZombiesAddonPublicApiBoundaryCompat', JavaExec) {
    group = 'verification'
    description = 'Run the physical addon-to-main public API source-boundary audit.'
    workingDir = project.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.architecture.ZombiesAddonPublicApiBoundaryCompatTest'
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}

tasks.register('runZombiesPhase0DataFixtureCompat', JavaExec) {
    group = 'verification'
    description = 'Run the addon-owned Phase 0 Zombies map, config, NBT, and ItemStack fixtures.'
    workingDir = project.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.compat.modesplit.Phase0ZombiesDataFixtureCompatTest'
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}

tasks.register('runModeSplitPhase7BoundaryCompat', JavaExec) {
    group = 'verification'
    description = 'Run the addon-owned logical and physical split boundary compatibility checks.'
    workingDir = project.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.verification.phase7.ModeSplitPhase7BoundaryCompatTest'
    systemProperty 'modeSplit.productionJavaRoots', [
            mainProject.file('src/main/java'), file('src/main/java')
    ]*.absolutePath.join(File.pathSeparator)
    systemProperty 'modeSplit.productionResourceRoots', [
            mainProject.file('src/main/resources'), file('src/main/resources')
    ]*.absolutePath.join(File.pathSeparator)
    systemProperty 'modeSplit.testJavaRoots', [
            mainProject.file('src/test/java'), file('src/test/java')
    ]*.absolutePath.join(File.pathSeparator)
    systemProperty 'modeSplit.testResourceRoots', [
            mainProject.file('src/test/resources'), file('src/test/resources')
    ]*.absolutePath.join(File.pathSeparator)
    systemProperty 'modeSplit.mainClassRoots', [
            mainProject.sourceSets.main.output.classesDirs.asPath,
            sourceSets.main.output.classesDirs.asPath
    ].join(File.pathSeparator)
    systemProperty 'modeSplit.verificationStage', 'target'
    systemProperty 'modeSplit.settingsFile', file('settings.gradle').absolutePath
    systemProperty 'modeSplit.expectedTestClassRoots', sourceSets.test.output.classesDirs.asPath
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}


tasks.register('runZombiesStorageMigrationCompat', JavaExec) {
    group = 'verification'
    description = 'Verify addon migration preflight rejects invalid rules without writing defaults.'
    workingDir = project.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.config.zombies.ZombiesStorageMigrationCompatTest'
    dependsOn tasks.named('testClasses')
    dependsOn mainProject.tasks.named('testClasses')
}


tasks.register('runZombiesBackpackCompatSuite', JavaExec) {
    group = 'verification'
    description = 'Run fixed-reserve backpack numeric validation, opaque labels, file preservation, and matching regressions; no skipped tests.'
    workingDir = project.projectDir
    classpath = splitCompatTestClasspath
    mainClass = 'com.cdp.codpattern.config.zombies.ZombiesBackpackCompatSuite'
    dependsOn tasks.named('testClasses')
}
